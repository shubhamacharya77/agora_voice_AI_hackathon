[project]
name = "coo-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "agora-agents>=2.15.0",
    "alembic>=1.20.1",
    "anthropic[bedrock]>=2.12.0",
    "argon2-cffi>=25.1.0",
    "botocore[crt]>=1.44.8",
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "sqlmodel>=0.0.50",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs the local PostgreSQL container (docker compose up -d db)"]
